---
cluster: "cirrus"

form:
  - cpu
  - memory

attributes:
  cpu:
    widget: number_field
    label: "CPUs"
    min: 1
    max: 8
    value: 2
    step: 1
    required: true
    help: |
      The desktop itself is idle most of the time; this is for what you run in
      it. Two is plenty for looking at files.

  memory:
    widget: number_field
    label: "Memory (GB)"
    min: 2
    max: 64
    value: 8
    step: 1
    required: true

