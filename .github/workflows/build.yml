name: Build and push Ubuntu Desktop image

on:
  workflow_dispatch:
  push:
    paths:
      - image/**
      - .github/workflows/build.yml
    branches:
      - main

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      # One place the tag is computed, one place the full reference is
      # assembled. The build, the push and the summary all read this output, so
      # the reference pasted into submit.yml.erb cannot drift from the one that
      # was pushed -- which it could when each step spelled it out again.
      - name: Compose the image reference
        id: ref
        run: |
          tag="$(date +'%Y-%m-%d.%H.%M')"
          {
            echo "tag=${tag}"
            echo "image=hub.k8s.ucar.edu/ncote/ubuntu-desktop:${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: registry login
        uses: docker/login-action@v3
        with:
          registry: hub.k8s.ucar.edu
          username: ${{ secrets.HARBOR_LOGIN }}
          password: ${{ secrets.HARBOR_SECRET }}

      # The image lives in a subdirectory, so the build context and the
      # Dockerfile are both named explicitly. OOD ignores image/ entirely -- it
      # reads the app files at the repo root.
      - name: Build image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          docker buildx build \
            -t "$IMAGE" \
            -f image/Dockerfile \
            image

      # Runs as an arbitrary uid, the way OnDemand runs the pod, and fails the
      # build before anything is pushed.
      - name: Smoke test
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm --user 54321:54321 -e HOME=/tmp/h -e USER=jdoe \
            --entrypoint /usr/local/bin/entrypoint.sh "$IMAGE" bootstrap bash -c '
              set -euo pipefail
              for b in ssh ssh-agent ssh-add jq curl git bao-getkey Xkasmvnc xfce4-session cirrus-desktop-gate; do
                command -v "$b" >/dev/null || { echo "MISSING: $b"; exit 1; }
              done
              echo "9fee1714bd7b149dec56798304350642167cae3eb9236aecfbc44fd39dc7bf9e  /usr/local/bin/bao-getkey" \
                | sha256sum -c --quiet
              [ "$(id -un)" = jdoe ] || { echo "uid has no user name"; exit 1; }
              echo "smoke test OK"
            '
          # A real session: the gate must serve its login page, and the
          # session ssh-agent must answer with no identities (exit 1, not 2).
          # KasmVNC rejects a password shorter than 6 characters.
          mkdir -p ood && printf 'password=smoke-test-pw\n' > ood/csenv && chmod -R a+rX ood
          docker run -d --name smoke --user 54321:54321 -p 18080:8080 \
            -v "$PWD/ood:/ood:ro" -e HOME=/tmp/h -e USER=jdoe \
            -e CIRRUS_DESKTOP_PASSWORD_FILE=/ood/csenv -e CIRRUS_DESKTOP_BASE_URL=/ \
            "$IMAGE" desktop
          for _ in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:18080/ && break
            sleep 1
          done
          curl -fs http://127.0.0.1:18080/ | grep -q 'Session password' \
            || { docker logs smoke; exit 1; }
          docker exec smoke bash -c 'SSH_AUTH_SOCK=/tmp/cirrus-desktop/ssh-agent.sock ssh-add -l; [ $? = 1 ]' \
            || { docker logs smoke; exit 1; }
          docker stop -t 20 smoke >/dev/null
          docker rm smoke >/dev/null
          echo "session smoke test OK"

      - name: Push image to Harbor
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: docker push "$IMAGE"

      # The reference is the one thing anybody wants out of a green run: nothing
      # uses the new image until it is pinned in submit.yml.erb by hand. A job
      # summary is one click from the run page and holds a copyable block; a log
      # line is neither. The ::notice puts it at the top of the run page too.
      - name: Summarise the pushed image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          echo "::notice title=Image pushed::${IMAGE}"

          # Both of these are read back from what was actually built rather than
          # assumed, and neither is worth failing an otherwise green build over.
          digest="$(docker image inspect \
              --format '{{ if .RepoDigests }}{{ index .RepoDigests 0 }}{{ end }}' \
              "$IMAGE" 2>/dev/null || true)"
          versions="$(docker run --rm --entrypoint cat "$IMAGE" \
              /opt/cirrus-desktop/versions.txt 2>/dev/null || true)"

          {
            echo "## Image pushed"
            echo
            echo '```'
            echo "${IMAGE}"
            echo '```'
            echo
            echo "Pin it in \`submit.yml.erb\`, in the \`desktop_img\` line near the top:"
            echo
            echo '```ruby'
            echo "  desktop_img = \"${IMAGE}\""
            echo '```'
            echo
            echo "Then re-run \`image/test/acceptance.sh\` against it before announcing the app."
            if [ -n "$digest" ]; then
              echo
              echo "Digest: \`${digest#*@}\`"
            fi
            if [ -n "$versions" ]; then
              echo
              echo "| component | version |"
              echo "| --- | --- |"
              printf '%s\n' "$versions" \
                | grep -v '^#' \
                | awk -F'\t' 'NF >= 2 { printf "| %s | `%s` |\n", $1, $2 }'
            fi
            echo
            echo "Tag \`${TAG}\` · commit \`${GITHUB_SHA:0:7}\` · built from \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
