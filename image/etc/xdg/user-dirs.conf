# Site-wide xdg-user-dirs configuration for the CIRRUS desktop image.
#
# $HOME here is GLADE over NFS, shared with Casper and Derecho. Left at its
# default this file is absent, xdg-user-dirs-update runs from the XFCE session
# start-up, and eight directories appear directly in the user's home --
# measured on this image with no configuration:
#
#   Desktop  Documents  Downloads  Music  Pictures  Public  Templates  Videos
#
# Nobody asked for them, they are visible from every HPC login node forever, and
# one of them (Desktop) differs from this app's own state directory only by
# case, which in a shared home is its own trap.
#
# enabled=False stops the writer. The readers -- GTK's file chooser, xfdesktop's
# icon view, Thunar's sidebar -- are handled separately: entrypoint.sh pins
# user-dirs.dirs inside this app's own configuration directory so those look up
# real, deliberate paths rather than resolving defaults against $HOME.
enabled=False
